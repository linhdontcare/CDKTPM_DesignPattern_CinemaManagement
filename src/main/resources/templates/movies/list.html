<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Danh sách Phim')}"></head>
<body>
<nav th:replace="~{layout/main :: navbar}"></nav>
<div th:replace="~{layout/main :: alerts}"></div>

<div class="container my-4">
    <!-- Header & Action Bar -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div>
            <h2 class="fw-bold mb-1"><i class="bi bi-camera-reels text-danger me-2"></i>Quản lý Danh sách Phim</h2>
            <p class="text-muted mb-0">Quản lý kho phim, thời lượng, thể loại và thông tin chi tiết</p>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/movies/new}" class="btn btn-danger">
                <i class="bi bi-plus-circle me-1"></i> Thêm Phim Mới
            </a>
        </div>
    </div>

    <!-- Search Form -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <form th:action="@{/movies}" method="get" class="row g-2 align-items-center">
                <div class="col-md-9 col-12">
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
                        <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm kiếm phim theo tên (vd: Avengers, Spider-Man)...">
                    </div>
                </div>
                <div class="col-md-3 col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-dark w-100"><i class="bi bi-search me-1"></i> Tìm kiếm</button>
                    <a th:if="${keyword != null && !keyword.isBlank()}" th:href="@{/movies}" class="btn btn-outline-secondary">Xóa</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Movies Grid / Cards -->
    <div class="row g-4" th:if="${not #lists.isEmpty(movies)}">
        <div class="col-12 col-md-6 col-lg-4" th:each="m : ${movies}">
            <div class="card h-100 shadow-sm border-0 rounded-3 overflow-hidden d-flex flex-column">
                <img th:if="${m.posterUrl != null && !m.posterUrl.isBlank()}"
                     th:src="${m.posterUrl}" class="movie-poster" alt="Movie Poster">
                <div th:unless="${m.posterUrl != null && !m.posterUrl.isBlank()}" class="movie-poster-placeholder">
                    <i class="bi bi-film"></i>
                </div>

                <div class="card-body d-flex flex-column flex-grow-1 p-3">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <span class="badge bg-danger-subtle text-danger" th:text="${m.genre}">Genre</span>
                        <span class="badge bg-light text-dark border">
                            <i class="bi bi-clock me-1"></i><span th:text="${m.duration} + ' phút'"></span>
                        </span>
                    </div>

                    <h5 class="card-title fw-bold text-dark mb-2" th:text="${m.title}">Movie Title</h5>
                    <p class="card-text text-muted small flex-grow-1" th:text="${#strings.abbreviate(m.description, 140)}">
                        Description
                    </p>

                    <hr class="my-2 text-muted opacity-25">

                    <div class="d-flex justify-content-between align-items-center pt-2">
                        <a th:href="@{/movies/{id}(id=${m.id})}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-info-circle me-1"></i> Chi tiết
                        </a>

                        <div class="d-flex gap-1">
                            <a th:href="@{/showtimes/new(movieId=${m.id})}" class="btn btn-sm btn-outline-success" title="Tạo suất chiếu">
                                <i class="bi bi-calendar-plus"></i>
                            </a>
                            <a th:href="@{/movies/edit/{id}(id=${m.id})}" class="btn btn-sm btn-outline-secondary" title="Chỉnh sửa">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/movies/delete/{id}(id=${m.id})}" method="post"
                                  onsubmit="return confirm('Bạn có chắc chắn muốn xóa phim này không?');" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(movies)}" class="text-center py-5 bg-white rounded-3 shadow-sm">
        <i class="bi bi-film text-muted fs-1 mb-3 d-block"></i>
        <h5>Không tìm thấy bộ phim nào</h5>
        <p class="text-muted">Hãy thêm phim mới hoặc thử lại từ khóa tìm kiếm khác.</p>
        <a th:href="@{/movies/new}" class="btn btn-danger mt-2">Thêm phim mới</a>
    </div>
</div>

<footer th:replace="~{layout/main :: footer}"></footer>
<div th:replace="~{layout/main :: scripts}"></div>
</body>
</html>
