<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Cinema Management'">Cinema Management</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- Navigation Bar -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-cinema sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
            <i class="bi bi-film text-danger fs-3"></i>
            <span>Cinema Pattern Hub</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/movies}"><i class="bi bi-camera-reels me-1"></i> Movies</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/showtimes}"><i class="bi bi-clock-history me-1"></i> Showtimes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/bookings}"><i class="bi bi-ticket-perforated me-1"></i> Booking</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/payments}"><i class="bi bi-credit-card me-1"></i> Payments</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2">
                <a href="/h2-console" target="_blank" class="btn btn-outline-warning btn-sm">
                    <i class="bi bi-database me-1"></i> H2 Console
                </a>
                <span class="badge bg-secondary">Phase 1: Baseline</span>
            </div>
        </div>
    </div>
</nav>

<!-- Alerts Fragment -->
<div th:fragment="alerts" class="container mt-3">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<!-- Footer Fragment -->
<footer th:fragment="footer" class="py-3 mt-auto">
    <div class="container text-center text-secondary small">
        <p class="mb-1">
            <strong>Chuyên đề Kỹ thuật Phần mềm</strong> — Nghiên cứu, ứng dụng và đánh giá Design Patterns
        </p>
        <p class="mb-0">
            Tech stack: Spring Boot 3 &bull; Thymeleaf &bull; Bootstrap &bull; H2 In-Memory DB
        </p>
    </div>
</footer>

<!-- Bootstrap JS -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</body>
</html>
